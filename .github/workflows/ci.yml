name: OpsPilot CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Markdown & Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify Documentation Structure
        run: |
          echo "Verifying presence of core docs..."
          test -f README.md
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f docs/README.md
          test -f docs/architecture/SYSTEM_ARCHITECTURE.md
          test -f docs/engineering/DATABASE_DESIGN.md
          echo "Documentation integrity check passed."

  code-quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "package.json not yet initialized for code-quality stage."
          fi

      - name: Run Linting
        run: |
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "Skipping lint: script not yet registered."
          fi

      - name: Run Type Check
        run: |
          if [ -f package.json ] && grep -q '"typecheck"' package.json; then
            npm run typecheck
          elif [ -f tsconfig.json ] && [ -n "$(find . -name '*.ts' -not -path '*/node_modules/*' -print -quit)" ]; then
            npx tsc --noEmit
          else
            echo "Skipping typecheck: no TypeScript source files to compile yet."
          fi

  unit-tests:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run Unit Tests
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "Unit test suite ready for Phase 1 implementation."
          fi
